<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сессия обучения</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    .online-dot {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-4">

  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Главная карточка сессии -->
    <div class="bg-white rounded-3xl shadow-xl p-6">
      <h1 class="text-2xl font-semibold text-center mb-6">
        Дүйсенбек Алмас Әлфарабиұлы
      </h1>

      <div class="flex justify-center items-center gap-4 mb-8">
        <i class="fas fa-clock text-5xl text-blue-600"></i>
        <div>
          <span id="timer" class="text-6xl font-bold text-blue-600">00:23</span>
          <span class="text-xl text-gray-500 ml-2">сек.</span>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <button onclick="endSession()" 
                class="bg-red-600 hover:bg-red-700 text-white font-medium py-4 rounded-2xl flex items-center justify-center gap-2 transition">
          <i class="fas fa-stop"></i>
          Завершить сессию
        </button>
        
        <button onclick="pauseSession()" 
                class="bg-yellow-500 hover:bg-yellow-600 text-white font-medium py-4 rounded-2xl flex items-center justify-center gap-2 transition">
          <i class="fas fa-pause"></i>
          Перерыв
        </button>
        
        <button onclick="exitSession()" 
                class="bg-gray-500 hover:bg-gray-600 text-white font-medium py-4 rounded-2xl flex items-center justify-center gap-2 transition">
          <i class="fas fa-sign-out-alt"></i>
          Выход
        </button>
      </div>
    </div>

    <!-- Монитор группы -->
    <div class="bg-white rounded-3xl shadow-xl p-6">
      <div class="flex items-center gap-3 mb-5">
        <i class="fas fa-users text-2xl"></i>
        <h2 class="text-2xl font-semibold">Монитор группы</h2>
      </div>

      <div class="flex items-center justify-between bg-gray-50 rounded-2xl p-4">
        <div class="flex items-center gap-4">
          <div class="relative">
            <div class="w-12 h-12 bg-blue-600 text-white rounded-full flex items-center justify-center text-xl font-bold">
              A
            </div>
            <div class="online-dot absolute bottom-0 right-0 w-5 h-5 bg-green-500 border-2 border-white rounded-full"></div>
          </div>
          <div>
            <p class="font-semibold text-lg">Almas</p>
            <p class="text-green-600 font-medium flex items-center gap-1">
              <span class="text-xl">●</span> онлайн
            </p>
          </div>
        </div>
        <div class="text-right">
          <p class="text-gray-600">Дома</p>
          <p class="text-sm text-gray-500">04 мин Ос</p>
        </div>
      </div>
    </div>

    <!-- Общий чат -->
    <div class="bg-white rounded-3xl shadow-xl p-6">
      <div class="flex items-center gap-3 mb-5">
        <i class="fas fa-comments text-2xl"></i>
        <h2 class="text-2xl font-semibold">Общий чат</h2>
      </div>

      <div class="h-80 bg-gray-50 rounded-2xl p-4 mb-4 overflow-y-auto space-y-3" id="chat">
        <div class="bg-white p-3 rounded-2xl">
          <strong>Дүйсенбек Алмас Әлфарабиұлы:</strong> 123
        </div>
        <div class="bg-white p-3 rounded-2xl">
          <strong>Алмас Дүйсенбек:</strong> 321
        </div>
      </div>

      <div class="flex gap-2">
        <input type="text" id="messageInput" 
               class="flex-1 border border-gray-300 rounded-2xl px-5 py-4 focus:outline-none focus:border-blue-500"
               placeholder="Сообщение...">
        <button onclick="sendMessage()" 
                class="bg-green-600 hover:bg-green-700 text-white w-14 h-14 rounded-2xl flex items-center justify-center text-2xl">
          →
        </button>
      </div>
    </div>

  </div>

  <script>
    // Таймер
    let seconds = 23;
    let timerInterval;

    function startTimer() {
      timerInterval = setInterval(() => {
        seconds++;
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        document.getElementById('timer').textContent = 
          `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Кнопки
    function endSession() {
      if (confirm("Завершить текущую сессию?")) {
        clearInterval(timerInterval);
        alert("Сессия завершена. Время сохранено в Supabase.");
      }
    }

    function pauseSession() {
      alert("Перерыв активирован (логика Supabase будет здесь)");
    }

    function exitSession() {
      if (confirm("Выйти из сессии?")) {
        window.location.reload();
      }
    }

    // Чат
    function sendMessage() {
      const input = document.getElementById('messageInput');
      if (input.value.trim() === '') return;

      const chat = document.getElementById('chat');
      const newMsg = document.createElement('div');
      newMsg.className = "bg-white p-3 rounded-2xl";
      newMsg.innerHTML = `<strong>Вы:</strong> ${input.value}`;
      chat.appendChild(newMsg);
      chat.scrollTop = chat.scrollHeight;
      input.value = '';
    }

    // Запуск таймера при загрузке
    window.onload = startTimer;
  </script>
</body>
</html>
